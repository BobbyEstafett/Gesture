<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 3D Hand Controller</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #00ffcc; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        .input_video { display: none; }
        #status { position: absolute; top: 20px; left: 20px; z-index: 10; letter-spacing: 1px; text-transform: uppercase; font-size: 12px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="status">Initialisation du système...</div>
    <video class="input_video" playsinline></video>
    <div id="canvas-container"></div>
    <script src="script.js"></script>
</body>
</html>
