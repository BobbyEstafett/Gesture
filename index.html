<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hologram Controller v3</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #00ffcc; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        .input_video { display: none; }
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #00ffcc;
            pointer-events: none; min-width: 200px;
        }
        .val { color: white; font-weight: bold; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="ui">
        <div>SYSTEM: <span id="sys-stat" class="val">INITIALISATION...</span></div>
        <div>L-HAND (Magnet): <span id="l-stat" class="val">--</span></div>
        <div>R-HAND (Light): <span id="r-stat" class="val">--</span></div>
    </div>
    <video class="input_video" playsinline></video>
    <div id="canvas-container"></div>
    <script src="script.js"></script>
</body>
</html>
