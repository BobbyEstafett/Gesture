<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hologram Controller v2</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #00ffcc; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; }
        .input_video { display: none; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.7); padding: 15px; border: 1px solid #00ffcc; pointer-events: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="ui">
        <div>STATUS: <span style="color:white">CONNECTED</span></div>
        <div>L-HAND: <span id="l-stat">--</span></div>
        <div>R-HAND: <span id="r-stat">--</span></div>
    </div>
    <video class="input_video" playsinline></video>
    <div id="canvas-container"></div>
    <script src="script.js"></script>
</body>
</html>
